name: Fabriquer l'installateur PC AMUNTCHI

on:
  push:
    branches: [main, master]
    paths: ['pc/**', '.github/workflows/build-pc.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    env:
      AMX_VERSION: "5.0"
    defaults:
      run:
        working-directory: pc
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v5

      - name: Installer Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les modules
        run: python -m pip install pillow reportlab pyinstaller opencv-python-headless

      - name: Fabriquer Amuntchi.exe
        run: python -m PyInstaller --clean --noconfirm --windowed --name Amuntchi --icon assets\amuntchi.ico --add-data "assets;assets" --hidden-import cloud_sync app.py

      - name: Auto-test (ouvre chaque écran du logiciel fabriqué)
        shell: pwsh
        run: |
          $env:APPDATA = "$env:RUNNER_TEMP\amx_test"
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          $p = Start-Process -FilePath "dist\Amuntchi\Amuntchi.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:APPDATA\Amuntchi\selftest.log"
          if ($p.ExitCode -ne 0) { throw "Auto-test en échec (code $($p.ExitCode))" }

      - name: Installer Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Fabriquer le programme d'installation
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe","C:\Program Files\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          & $iscc.FullName installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup en échec" }

      - name: Joindre l'installateur au résultat
        uses: actions/upload-artifact@v4
        with:
          name: AMUNTCHI-PC-Installation
          path: pc/Output/AMUNTCHI-PC-V5-Installation.exe

      - name: Publier l'installateur (onglet Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-v5.0-build${{ github.run_number }}
          name: AMUNTCHI PC V5.0 - installation Windows (fabrication ${{ github.run_number }})
          body: |
            Programme d'installation du logiciel PC AMUNTCHI (Windows 10/11).
            Téléchargez AMUNTCHI-PC-V5-Installation.exe, lancez-le et suivez l'assistant.
            Les données existantes du PC sont conservées.
          files: pc/Output/AMUNTCHI-PC-V5-Installation.exe
